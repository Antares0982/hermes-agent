name: antares-platform
label: Antares Bridge
kind: platform
version: 0.1.0
description: >
  Custom RabbitMQ bridge for connecting Hermes Agent to the
  antares-bot Telegram bot framework via public RabbitMQ.
author: Antares0982
requires_env:
  - name: ANTARES_RABBITMQ_HOST
    description: "RabbitMQ server hostname"
    prompt: "RabbitMQ host"
    password: false
  - name: ANTARES_RABBITMQ_CAFILE
    description: "Path to CA certificate for TLS"
    prompt: "CA file path"
    password: false
  - name: ANTARES_RABBITMQ_CERTFILE
    description: "Path to client certificate for TLS"
    prompt: "Client cert path"
    password: false
  - name: ANTARES_RABBITMQ_KEYFILE
    description: "Path to client key for TLS"
    prompt: "Client key path"
    password: false
optional_env:
  - name: ANTARES_RABBITMQ_PORT
    description: "RabbitMQ port (default 5671 for TLS, 5672 for plain)"
    prompt: "RabbitMQ port"
    password: false
  - name: ANTARES_RABBITMQ_USER
    description: "RabbitMQ username"
    prompt: "RabbitMQ user"
    password: false
  - name: ANTARES_RABBITMQ_PASS
    description: "RabbitMQ password"
    prompt: "RabbitMQ password"
    password: true
  - name: ANTARES_RABBITMQ_VHOST
    description: "RabbitMQ virtual host (default /)"
    prompt: "RabbitMQ vhost"
    password: false
  - name: ANTARES_ALLOWED_USERS
    description: "Comma-separated Telegram user IDs allowed to interact with Hermes"
    prompt: "Allowed user IDs"
    password: false
  - name: ANTARES_ALLOW_ALL_USERS
    description: "Allow all users forwarded by the bot (dev only)"
    prompt: "Allow all users?"
    password: false
